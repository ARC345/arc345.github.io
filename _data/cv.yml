    - name: Learning & Unlearning Noise in State-Space Models ([code](https://github.com/ARC345/learn-unlearn-mamba), [write-up](https://arnav.rastogi.net.in/blog/2026/mamba-noise-learning-unlearning/))
      date: 2026
      highlights:
      - Extended a QUEST Lab (IISc) study on noise learning/unlearning in transformer SLMs to **Mamba-1.4B**, running the full three-phase protocol (clean finetune → noisy finetune → clean retrain) on SQuAD across 4 noise types.
      - Found Mamba absorbs token-level noise far more than transformers (**71% accuracy drop** under word-flip vs. 27–38% for Olmo/Qwen/Gemma/Phi-2), while counterfactual noise *raised* its accuracy, a behavior no transformer showed.
      - Identified confounds limiting the comparison (base vs. instruction-tuned models, fuzzy-match vs. LLM-judge scoring, extra epochs inflating Phase 3 recovery to 124–133%) and documented them alongside results.
