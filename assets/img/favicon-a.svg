<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="0" fill="#000000"/>
  <!-- Pixel art A: 5x5 grid, each pixel 16x16, 2px gap, 10px padding -->
  <!-- Row 0: .XXX. -->
  <rect x="26" y="10" width="14" height="14" fill="white"/>
  <rect x="42" y="10" width="14" height="14" fill="white"/>
  <rect x="58" y="10" width="14" height="14" fill="white"/>
  <!-- Row 1: X...X -->
  <rect x="10" y="26" width="14" height="14" fill="white"/>
  <rect x="74" y="26" width="14" height="14" fill="white"/>
  <!-- Row 2: XXXXX -->
  <rect x="10" y="42" width="14" height="14" fill="white"/>
  <rect x="26" y="42" width="14" height="14" fill="white"/>
  <rect x="42" y="42" width="14" height="14" fill="white"/>
  <rect x="58" y="42" width="14" height="14" fill="white"/>
  <rect x="74" y="42" width="14" height="14" fill="white"/>
  <!-- Row 3: X...X -->
  <rect x="10" y="58" width="14" height="14" fill="white"/>
  <rect x="74" y="58" width="14" height="14" fill="white"/>
  <!-- Row 4: X...X -->
  <rect x="10" y="74" width="14" height="14" fill="white"/>
  <rect x="74" y="74" width="14" height="14" fill="white"/>
</svg>
