[workspace]
authors = ["ARC345 <arnavrastogi.543@gmail.com>"]
channels = ["conda-forge"]
name = "arc345.github.io"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
install = "gem install bundler && bundle install && npm install"
fetch-resume = "bash .github/scripts/fetch-resume.sh"
dev = { cmd = "bundle exec jekyll serve", depends-on = ["fetch-resume"] }
build = { cmd = "bundle exec jekyll build", depends-on = ["fetch-resume"] }
clean = "bundle exec jekyll clean"
export-requirements = "pixi run pip freeze > requirements.txt"
purgecss = "npx purgecss -c purgecss.config.js"

[dependencies]
ruby = ">=3.4.8,<4"
nodejs = ">=25.2.1,<25.3"
python = ">=3.14.2,<3.15"
imagemagick = ">=7.1.2_12,<8"
nbconvert = ">=7.16.6,<8"
compilers = ">=1.11.0,<2"
make = ">=4.4.1,<5"
pkg-config = ">=0.29.2,<0.30"
