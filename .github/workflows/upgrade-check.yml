name: Upgrade contract checks

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "_config.yml"
      - "_data/**"
      - "_pages/**"
      - "_posts/**"
      - "_projects/**"
      - "assets/**"
      - "Gemfile"
      - "Gemfile.lock"
      - ".github/workflows/upgrade-check.yml"
  pull_request:
    branches:
      - main
      - dev
    paths:
      - "_config.yml"
      - "_data/**"
      - "_pages/**"
      - "_posts/**"
      - "_projects/**"
      - "assets/**"
      - "Gemfile"
      - "Gemfile.lock"
      - ".github/workflows/upgrade-check.yml"

jobs:
  upgrade-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Ruby 💎
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Run upgrade audit 🧪
        run: bundle exec al-folio upgrade audit

      - name: Upload upgrade report 📄
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: al-folio-upgrade-report
          path: al-folio-upgrade-report.md
          if-no-files-found: ignore
